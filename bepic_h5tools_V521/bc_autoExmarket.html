<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置构建</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script><script defer="defer" src="./bc_autoExmarket/js/4a183009e3d17845ea9c309cc9c61ded.js"></script><link href="./bc_autoExmarket/css/e492b38f3ca4f80442dd.css" rel="stylesheet"></head><body><div class="container"><div class="view"><div class="onerow"><div><h4>模板名称</h4><select id="templateSelect"></select></div></div><div class="onerow"><div><h4>子域名</h4><input id="childHost" placeholder="www"></div><div><h4>站点名称</h4><input id="siteNameInput" placeholder="输入站点名称"></div><div><h4>域名后缀</h4><select id="SitetypeSelect"></select></div></div><div><h4>Slots个数</h4><input id="slotsNumInput" placeholder="默认为:3"></div><div><h4>构建配置</h4><textarea id="configText"></textarea></div><div class="buttondiv"><button id="copyButton" disabled="disabled">复制配置<div class="copymessage" id="copyMessage">成功！！！</div></button></div></div><div class="configNode"><div class="usetext"><h4>使用说明：</h4><ol><li>取默认配置：选择模板，输入站点名称，slot个数0，点击复制。</li><li>广告生成：在表 <a href="https://ai2z7i5xm0.feishu.cn/base/NTsIbxvDva51jqsgL7kcrTNmnef?table=tblFtMDu5k9H6RGG&view=vew5wSiQtW">H5网址进度管理</a> 或 <a href="https://ai2z7i5xm0.feishu.cn/base/D26LbzZEra5ZzdsBDhxcAmcOnFh?table=tblguGARTdR5uuvE&view=vewArzNYxH">GAM网站任务管理</a> 查看cp返回对应站点为需要广告位num，输入站点名称，slot个数num。<br></li></ol></div><p style="font-size: 12px;margin: 15px;">（配置： <strong>htmlTest</strong> 为首页，详情页，分类页通用标头header。<strong> 'ad0_'、'ad1_'、'ad2_'、</strong>分别代表<strong>首页、详情页、分类页 </strong>的body广告位。）</p></div></div></body></html>
