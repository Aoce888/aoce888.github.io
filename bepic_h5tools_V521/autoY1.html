<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置构建</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script><script defer="defer" src="./vender/0dfd62dc39148cf747e436ce3ce20741.js"></script><script defer="defer" src="./autoY1/js/ecb13f7026ef8a8f6a1a44169461b7d6.js"></script><link href="./autoY1/css/45f70ee3f860e070ce47.css" rel="stylesheet"></head><body><div class="container"><div class="view"><div class="onerow"><div><h4>模板名称</h4><select id="templateSelect"></select></div><div><h4>网络通道</h4><input id="NewWorkInput" placeholder="网络通道" value="233509614"></div></div><div class="onerow"><div><h4>子域名</h4><input id="childHost" placeholder="www"></div><div><h4>站点名称<span style="color: red;">*</span></h4><input id="siteNameInput" placeholder="输入站点名称"></div><div><h4>域名后缀</h4><select id="SitetypeSelect"></select></div></div><div class="onerow"><div><h4>指定路径</h4><input id="dirpath" placeholder="可选填" required></div></div><div><h4>构建配置</h4><textarea id="configText"></textarea></div><div class="buttondiv"><button id="copyButton" disabled="disabled">复制配置<div class="copymessage" id="copyMessage">成功！！！</div></button></div></div><div class="configNode"><h4>配置信息:</h4><div id="configInfo"></div><div class="usetext"><h4>使用说明：</h4><ol><li>取默认配置：选择模板，输入站点名称，输入网络通道,会自动生成广告配置。</li></ol></div><p style="font-size: 12px;margin: 15px;">（配置： <strong>htmlTest</strong> 为首页，详情页，分类页通用标头header。<strong> 'ad0_'、'ad1_'、'ad2_'、</strong>分别代表<strong>首页、详情页、分类页 </strong>的body广告位。）</p><p style="font-size: 12px"><strong>（附: </strong>存表,进入对应工作表格，找到对应站点<strong>HostConfig）</strong>行，存入复制出来的新配置。</p></div></div></body></html>
