<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量打开网址</title><script defer="defer" src="./openurls/js/37d3362cdbb962b0e5a0da762b07910a.js"></script><link href="./openurls/css/385b3fe70d6eb7249376.css" rel="stylesheet"></head><body><div class="view"><div><h2 for="urlInput">输入网址：</h2><textarea id="urlInput" placeholder="https://example1.com&#10;https://example2.com&#10;https://example3.com" oninput="formatURLs()"></textarea> <button onclick="openURLs()">打开</button><script>function formatURLs() {
          var urlInput = document.getElementById('urlInput');
          var formattedValue = urlInput.value.replace(/\s+/g, '\n');
          urlInput.value = formattedValue;
        }

        function openURLs() {
          var urlInput = document.getElementById('urlInput');
          var urls = urlInput.value.split('\n');

          urls.forEach(function (url) {
            if (url.trim() !== "") {
              if (/^https?:\/\//.test(url)) {
                window.open(url.trim(), '_blank');
              } else {
                window.open('https://' + url.trim(), '_blank');
              }
            }
          });
        }</script></div><div class="bottomView"><div class="bottomViewChild"><h4>模板名称</h4><select id="templateSelect"></select></div><div class="bottomViewChild"><h4>logo</h4><input type="file" id="file-input"> <button onclick="uploadFile()">上传</button><script>function uploadFile() {
          var fileInput = document.getElementById('file-input');
          var file = fileInput.files[0];
    
          if (file) {
            var formData = new FormData();
            formData.append('file', file);
    
            // 发送文件上传请求
            var request = new XMLHttpRequest();
            request.open('POST', '上传的目标URL');
            request.send(formData);
    
            // 处理上传成功或失败的回调
            request.onload = function() {
              if (request.status === 200) {
                // 上传成功
                console.log('文件上传成功');
              } else {
                // 上传失败
                console.log('文件上传失败');
              }
            };
          }
        }</script></div></div></div></body></html>
