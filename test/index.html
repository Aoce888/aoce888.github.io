<body>
  <h1>！！！！！</h1>
  <button id="jumpButton">跳转链接</button>
  <script>
    document.getElementById('jumpButton').addEventListener('click', function (event) {
      const url = 'https://example.com'; // 设置你想要跳转的目标 URL

      // 延迟跳转以确保事件发送
      setTimeout(function () {
        window.location.href = url;
      }, 100);
    });
  </script>

  <div class="content-section">
  </div>
</body>
